# Comprobaciones de Oniel en cada pull request y en cada push a main.
#
# Son los mismos comandos que documenta el README en «Pruebas» y «Comprobaciones»: si cambian allí,
# cambian aquí. Los dos trabajos corren en paralelo y el conjunto debe quedar por debajo de diez minutos.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A mano, y desde el refresco del GTFS (gtfs.yml): GitHub retiene los flujos de `pull_request`
  # de una PR que abre otro flujo hasta que alguien los aprueba, así que aquel lanza este sobre la rama.
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior, que ya no interesa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oniel
          POSTGRES_PASSWORD: oniel
          POSTGRES_DB: oniel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oniel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv y Python 3.13 (con caché de paquetes)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Dependencias (uv sync, con el lockfile tal cual)
        run: uv sync --locked

      - name: Formato (ruff format)
        run: uv run ruff format --check .

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Tipos (mypy estricto)
        run: uv run mypy

      - name: Tipos (pyright, modo standard)
        run: uv run pyright

      - name: Crear la base de pruebas oniel_test
        run: docker exec ${{ job.services.postgres.id }} createdb -U oniel oniel_test

      - name: Pruebas (pytest, incluidas las de integración con PostgreSQL)
        run: uv run pytest
        env:
          ONIEL_TEST_DATABASE_URL: postgresql://oniel:oniel@localhost:5432/oniel_test

      - name: Validar la red y la resolución de horarios (oniel-data validate)
        run: uv run oniel-data validate

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Node 20 (con caché de npm)
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias (npm ci)
        run: npm ci

      - name: Tipos (tsc, visor y pruebas)
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Compilar el visor (vite build)
        run: npm run build

      - name: Versión de Playwright instalada
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Caché del Chromium de Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Solo el navegador: la imagen del runner ya trae Chromium y sus librerías, así que
      # `playwright install-deps` (un apt-get de 1,5 a 3,5 minutos) sobra.
      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Pruebas Playwright sobre la instantánea estática (sin servidor)
        run: npx playwright test
        env:
          ONIEL_E2E_STATIC: "1"

      - name: Guardar trazas y capturas de las pruebas que fallen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
