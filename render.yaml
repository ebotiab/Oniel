# Blueprint de Render para Oniel: API FastAPI + job de importación. La base de datos es externa.
# Despliegue: https://dashboard.render.com/blueprints → New Blueprint Instance → este repositorio.
# Tras el primer despliegue, ejecuta el job "oniel-importer" (o `oniel-data import all` en la shell del servicio).
# La base de datos no está en Render: su PostgreSQL gratuito caduca a los 30 días. La API se conecta
# a un PostgreSQL externo que no caduca (Neon, región de Fráncfort) con la cadena de DATABASE_URL,
# que se escribe a mano en el panel de Render. Detalle en docs/despliegue.md, «Base de datos».
services:
  - type: web
    name: oniel-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false   # cadena de conexión directa (sin pooler) de la base externa; se escribe en el panel
      - key: ONIEL_ENVIRONMENT
        value: production
      - key: ONIEL_CORS_ORIGINS
        value: '["https://oniel.vercel.app"]'
      - key: ONIEL_IMPORT_ON_START
        value: "1"    # sin cron job, cada arranque ejecuta `oniel-data import all --if-changed --no-snapshot` antes de servir
                      # (≈1 min en Render, solo tras un despliegue nuevo; al despertar se salta)
      - key: LOGFIRE_TOKEN
        sync: false   # token de escritura del proyecto ebotiab/oniel; se aporta al aprobar el primer sync

  # Importador programado (opcional, de pago). Render no ofrece cron jobs en el plan gratuito y pide
  # un método de pago en el workspace para crearlo. Para activarlo: añade un método de pago en
  # https://dashboard.render.com/billing, descomenta el bloque y haz push; el Blueprint lo sincroniza.
  # Sin él, la API importa los datos en cada arranque (ONIEL_IMPORT_ON_START=1); si lo activas, quita esa
  # variable de oniel-api. También puede lanzarse a mano desde cualquier máquina con acceso a la base:
  #   ONIEL_DATABASE_URL=<External Database URL> uv run oniel-data import all
  # # Importación repetible: se lanza a mano desde el panel (Jobs) o tras actualizar el GTFS.
  # - type: cron
  #   name: oniel-importer
  #   runtime: docker
  #   rootDir: backend
  #   dockerfilePath: ./Dockerfile
  #   plan: starter
  #   region: frankfurt
  #   schedule: "0 5 * * 1"   # lunes a las 5:00 UTC; también se puede ejecutar manualmente
  #   dockerCommand: oniel-data import all
  #   envVars:
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: ONIEL_ENVIRONMENT
  #       value: production
  #     - key: LOGFIRE_TOKEN
  #       sync: false
